#! The permissions on the RabbitMQ Cluster Operator resources, added to the Kubernetes default roles via aggregation, so that the
#! users bound to `admin`, `edit`, or `view` in a namespace can use them there. `view` is included in `edit`,
#! and `edit` in `admin`. The resources are listed explicitly, so that new ones are granted deliberately.
#! See: https://kubernetes.io/docs/reference/access-authn-authz/rbac/#aggregated-clusterroles

#! The RabbitMQ clusters of the namespace.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rabbitmq-operator-edit
  labels:
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
rules:
  - apiGroups: ["rabbitmq.com"]
    resources: ["rabbitmqclusters"]
    verbs: ["create", "delete", "deletecollection", "patch", "update"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rabbitmq-operator-view
  labels:
    rbac.authorization.k8s.io/aggregate-to-view: "true"
rules:
  - apiGroups: ["rabbitmq.com"]
    resources: ["rabbitmqclusters"]
    verbs: ["get", "list", "watch"]

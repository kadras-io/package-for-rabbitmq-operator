---
apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: hello-world
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hello-world-server
status:
  readyReplicas: 1
---
apiVersion: v1
kind: Secret
metadata:
  name: hello-world-default-user
---
# The `edit` role manages the resources, and the `view` role reads them.
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
commands:
  - script: test "$(kubectl auth can-i create rabbitmqclusters.rabbitmq.com -n $NAMESPACE --as=developer)" = yes
  - script: test "$(kubectl auth can-i delete rabbitmqclusters.rabbitmq.com -n $NAMESPACE --as=developer)" = yes
  - script: test "$(kubectl auth can-i list rabbitmqclusters.rabbitmq.com -n $NAMESPACE --as=viewer)" = yes
  - script: test "$(kubectl auth can-i create rabbitmqclusters.rabbitmq.com -n $NAMESPACE --as=viewer)" = no

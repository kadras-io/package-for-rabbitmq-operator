---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq-cluster-operator
  namespace: rabbitmq-system
status:
  readyReplicas: 1
---
# cert-manager issued the certificate of the webhook server.
apiVersion: v1
kind: Secret
metadata:
  name: cluster-operator-webhook-server-cert
  namespace: rabbitmq-system
type: kubernetes.io/tls
---
apiVersion: v1
kind: Secret
metadata:
  name: canonical-registry-credentials
  namespace: rabbitmq-system
  annotations:
    secretgen.carvel.dev/image-pull-secret: ""
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: e30K
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq-cluster-operator
  namespace: rabbitmq-system
spec:
  template:
    spec:
      imagePullSecrets:
        - name: canonical-registry-credentials

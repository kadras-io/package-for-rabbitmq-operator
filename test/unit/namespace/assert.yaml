apiVersion: v1
kind: Namespace
metadata:
  name: messaging
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq-cluster-operator
  namespace: messaging
---
apiVersion: v1
kind: Service
metadata:
  name: cluster-operator-webhook-service
  namespace: messaging
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cluster-operator-serving-cert
  namespace: messaging
spec:
  dnsNames:
  - cluster-operator-webhook-service.messaging.svc
  - cluster-operator-webhook-service.messaging.svc.cluster.local
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rabbitmq-cluster-operator-rolebinding
(subjects[?namespace != 'messaging'] | length(@)): 0
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rabbitmq-cluster-leader-election-rolebinding
  namespace: messaging
(subjects[?namespace != 'messaging'] | length(@)): 0
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: cluster-operator-mutating-webhook-configuration
  annotations:
    cert-manager.io/inject-ca-from: messaging/cluster-operator-serving-cert
(webhooks[?clientConfig.service.namespace != 'messaging'] | length(@)): 0
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: cluster-operator-validating-webhook-configuration
  annotations:
    cert-manager.io/inject-ca-from: messaging/cluster-operator-serving-cert
(webhooks[?clientConfig.service.namespace != 'messaging'] | length(@)): 0
---
apiVersion: v1
kind: Secret
metadata:
  name: canonical-registry-credentials
  namespace: messaging

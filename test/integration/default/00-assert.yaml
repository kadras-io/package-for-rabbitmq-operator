---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq-cluster-operator
  namespace: rabbitmq-system
status:
  readyReplicas: 1
---
# cert-manager issued the certificate of the webhook server.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cluster-operator-serving-cert
  namespace: rabbitmq-system
status:
  (conditions[?type == 'Ready']):
  - status: "True"
---
apiVersion: v1
kind: Secret
metadata:
  name: canonical-registry-credentials
  namespace: rabbitmq-system
  annotations:
    secretgen.carvel.dev/image-pull-secret: ""
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: e30K
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq-cluster-operator
  namespace: rabbitmq-system
spec:
  template:
    spec:
      imagePullSecrets:
        - name: canonical-registry-credentials

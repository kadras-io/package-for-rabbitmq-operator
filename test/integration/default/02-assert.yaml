---
# Uninstalling the package keeps the CustomResourceDefinition, the namespace, and the RabbitMQ clusters with their data.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: rabbitmqclusters.rabbitmq.com
---
apiVersion: v1
kind: Namespace
metadata:
  name: rabbitmq-system
---
apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: hello-world
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: persistence-hello-world-server-0
status:
  phase: Bound
---
apiVersion: v1
kind: Pod
metadata:
  name: hello-world-server-0
status:
  phase: Running

#@ load("@ytt:data", "data")
#@ load("@ytt:overlay", "overlay")

#! The operator runs in the package namespace. It reads it from the `OPERATOR_NAMESPACE` environment variable,
#! but the upstream manifest references it in the role bindings, in the admission webhooks,
#! and in the certificate of the webhook server.

#@ upstream = "rabbitmq-system"
#@ namespace = data.values.namespace

#@overlay/match by=overlay.subset({"kind":"Namespace", "metadata":{"name":upstream}})
---
metadata:
  name: #@ namespace

#@overlay/match by=overlay.subset({"metadata":{"namespace":upstream}}), expects="1+"
---
metadata:
  namespace: #@ namespace

#@ cluster_role_bindings = overlay.subset({"kind":"ClusterRoleBinding"})
#@ role_bindings = overlay.subset({"kind":"RoleBinding"})

#@overlay/match by=overlay.or_op(cluster_role_bindings, role_bindings), expects="1+"
---
subjects:
#@overlay/match by=overlay.subset({"kind":"ServiceAccount"}), expects="1+"
- namespace: #@ namespace

#@ mutating_webhooks = overlay.subset({"kind":"MutatingWebhookConfiguration"})
#@ validating_webhooks = overlay.subset({"kind":"ValidatingWebhookConfiguration"})

#! cert-manager injects the CA of the webhook server certificate into the webhook configurations.
#@overlay/match by=overlay.or_op(mutating_webhooks, validating_webhooks), expects=2
---
metadata:
  annotations:
    cert-manager.io/inject-ca-from: #@ namespace + "/cluster-operator-serving-cert"
webhooks:
#@overlay/match by=overlay.all, expects="1+"
- clientConfig:
    service:
      namespace: #@ namespace

#@overlay/match by=overlay.subset({"kind":"Certificate", "metadata":{"name":"cluster-operator-serving-cert"}})
---
spec:
  dnsNames:
  #@overlay/match by=overlay.index(0)
  - #@ "cluster-operator-webhook-service.{}.svc".format(namespace)
  #@overlay/match by=overlay.index(1)
  - #@ "cluster-operator-webhook-service.{}.svc.cluster.local".format(namespace)

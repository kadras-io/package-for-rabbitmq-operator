apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq-cluster-operator
spec:
  replicas: 3
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rabbitmq-cluster-operator
  namespace: rabbitmq-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq-cluster-operator

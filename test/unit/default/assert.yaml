apiVersion: v1
kind: Namespace
metadata:
  name: rabbitmq-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
  annotations:
    # Uninstalling the package keeps the namespace, and installing it again adopts it.
    kapp.k14s.io/delete-strategy: orphan
    kapp.k14s.io/create-strategy: fallback-on-update
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: rabbitmqclusters.rabbitmq.com
  annotations:
    # Deleting the CRD would delete all the RabbitMQ clusters and their data.
    kapp.k14s.io/delete-strategy: orphan
    kapp.k14s.io/create-strategy: fallback-on-update
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq-cluster-operator
  namespace: rabbitmq-system
spec:
  replicas: 1
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      imagePullSecrets:
      - name: canonical-registry-credentials
      (containers[?name == 'operator'] | [0]):
        args:
        - --health-probe-bind-address=:8081
        - --zap-log-level=info
        env:
        - name: OPERATOR_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        (starts_with(image, 'quay.io/rabbitmqoperator/cluster-operator:')): true
---
apiVersion: v1
kind: Service
metadata:
  name: cluster-operator-webhook-service
  namespace: rabbitmq-system
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-cluster-operator-metrics-service
  namespace: rabbitmq-system
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cluster-operator-serving-cert
  namespace: rabbitmq-system
spec:
  dnsNames:
  - cluster-operator-webhook-service.rabbitmq-system.svc
  - cluster-operator-webhook-service.rabbitmq-system.svc.cluster.local
  issuerRef:
    name: selfsigned-issuer
  secretName: cluster-operator-webhook-server-cert
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned-issuer
  namespace: rabbitmq-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rabbitmq-cluster-operator-rolebinding
subjects:
- kind: ServiceAccount
  name: rabbitmq-cluster-operator
  namespace: rabbitmq-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rabbitmq-cluster-leader-election-rolebinding
  namespace: rabbitmq-system
subjects:
- kind: ServiceAccount
  name: rabbitmq-cluster-operator
  namespace: rabbitmq-system
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: cluster-operator-mutating-webhook-configuration
  annotations:
    cert-manager.io/inject-ca-from: rabbitmq-system/cluster-operator-serving-cert
(webhooks[?clientConfig.service.namespace != 'rabbitmq-system'] | length(@)): 0
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: cluster-operator-validating-webhook-configuration
  annotations:
    cert-manager.io/inject-ca-from: rabbitmq-system/cluster-operator-serving-cert
(webhooks[?clientConfig.service.namespace != 'rabbitmq-system'] | length(@)): 0
---
apiVersion: v1
kind: Secret
metadata:
  name: canonical-registry-credentials
  namespace: rabbitmq-system
  annotations:
    secretgen.carvel.dev/image-pull-secret: ""
type: kubernetes.io/dockerconfigjson

---
# The RabbitMQ Cluster Operator resources are added to the Kubernetes default roles.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rabbitmq-operator-edit
  labels:
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rabbitmq-operator-view
  labels:
    rbac.authorization.k8s.io/aggregate-to-view: "true"

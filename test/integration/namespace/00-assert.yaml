---
# The operator is deployed in a custom namespace, with a standby replica.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq-cluster-operator
  namespace: messaging
status:
  readyReplicas: 2
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rabbitmq-cluster-operator
  namespace: messaging
---
apiVersion: v1
kind: Secret
metadata:
  name: cluster-operator-webhook-server-cert
  namespace: messaging
type: kubernetes.io/tls
